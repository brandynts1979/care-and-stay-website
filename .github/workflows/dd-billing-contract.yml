name: DD billing contract tests

on:
  push:
    paths:
      - 'supabase/functions/dd-stripe-webhook/**'
      - 'tests/dd-billing/**'
      - '.github/workflows/dd-billing-contract.yml'
  pull_request:
    paths:
      - 'supabase/functions/dd-stripe-webhook/**'
      - 'tests/dd-billing/**'
      - '.github/workflows/dd-billing-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  billing-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify DD billing event mapping and paid-access contracts
        run: node --test tests/dd-billing/*.test.mjs

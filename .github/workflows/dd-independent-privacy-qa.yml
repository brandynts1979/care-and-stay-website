name: DD independent privacy QA
on:
  pull_request:
    branches: [dd-privacy-controls-20261125]
    paths: ['.github/qa/dd-expired-privacy.spec.mjs', '.github/qa/dd-privacy.config.mjs', '.github/workflows/dd-independent-privacy-qa.yml']
permissions:
  contents: read
jobs:
  synthetic-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=.github/qa/dd-privacy.config.mjs

name: DD caregiver static checks
on:
  push:
    paths:
      - 'dd-caregiver-dev/**'
      - '.github/workflows/dd-caregiver-checks.yml'
  pull_request:
    paths:
      - 'dd-caregiver-dev/**'
      - '.github/workflows/dd-caregiver-checks.yml'
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check DD application syntax and required modules
        run: node dd-caregiver-dev/tests/check-app.mjs
